model: V-Model
summary: Each development level is paired with a test level planned at the same time.
phases:
  - name: Requirements and acceptance test design
    activities: [Specify requirements, Design acceptance tests in parallel]
    roles: [Business analyst, QA lead, Compliance officer]
    deliverables: [Approved SRS, Acceptance test specification]
    security_activities: [Security and privacy requirements analysis]
    testing: [Acceptance test cases derived from each requirement]
    compliance_checkpoints: [Regulatory interpretation review]
    approval_gates: [Requirements baseline sign-off]
    entry_criteria: [Project charter approved]
    exit_criteria: [Every requirement has an acceptance test]
    traceability: [Requirement to acceptance test links]
  - name: System design and system test design
    activities: [System architecture, System test design]
    roles: [Architect, Security officer, QA lead]
    deliverables: [System design, System test specification]
    security_activities: [Threat modelling, Security architecture review]
    testing: [System and transaction-integrity test cases]
    compliance_checkpoints: [Data-protection design review]
    approval_gates: [Design sign-off]
    entry_criteria: [Requirements baseline approved]
    exit_criteria: [Design and system tests approved]
    traceability: [Requirement to design to system test links]
  - name: Detailed design and implementation
    activities: [Module design, Coding, Unit test design]
    roles: [Developers, Tech lead]
    deliverables: [Source code, Unit tests]
    security_activities: [Static application security testing (SAST), Secure code review]
    testing: [Unit testing]
    compliance_checkpoints: []
    approval_gates: []
    entry_criteria: [Design approved]
    exit_criteria: [Unit tests pass]
    traceability: [Code linked to design elements]
  - name: Integration and system testing
    activities: [Integration testing, System testing]
    roles: [QA engineers]
    deliverables: [Integration and system test reports]
    security_activities: [Dynamic security testing (DAST), Penetration test]
    testing: [Transaction-integrity testing, Performance testing, Regression testing]
    compliance_checkpoints: [Verification evidence pack]
    approval_gates: [Security sign-off]
    entry_criteria: [Unit-tested build available]
    exit_criteria: [All system tests passed]
    traceability: [Test results linked to requirements]
  - name: Acceptance and release
    activities: [User acceptance testing, Release]
    roles: [Business users, Release manager, Compliance officer]
    deliverables: [UAT report, Release notes]
    security_activities: [Production hardening check]
    testing: [Acceptance testing against the specification]
    compliance_checkpoints: [Go-live compliance confirmation]
    approval_gates: [UAT sign-off, Go-live approval]
    entry_criteria: [System tests passed]
    exit_criteria: [Accepted by business and compliance]
    traceability: [Complete requirement-to-test coverage report]
