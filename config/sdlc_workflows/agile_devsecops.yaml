model: Agile + DevSecOps
summary: Agile iterations with security, compliance evidence and delivery automated in the pipeline.
phases:
  - name: Backlog and security planning
    activities: [User stories with acceptance criteria, Security and compliance stories, Pipeline policies]
    roles: [Product owner, Business analyst, Security officer, Compliance officer]
    deliverables: [Product backlog, Pipeline policy as code]
    security_activities: [Threat modelling per epic, Abuse cases]
    testing: [Definition of done includes automated tests]
    compliance_checkpoints: [Map regulated stories to controls]
    approval_gates: [Release scope and control mapping agreed]
    entry_criteria: [Product vision agreed]
    exit_criteria: [Ready backlog, controls mapped]
    traceability: [Stories and controls linked to requirements]
  - name: Sprint build with CI security
    activities: [Sprint planning, Development, Continuous integration]
    roles: [Developers, Scrum master]
    deliverables: [Built increment, SBOM]
    security_activities: [Static application security testing (SAST), Dependency and secret scanning, Peer code review]
    testing: [Automated unit tests]
    compliance_checkpoints: []
    approval_gates: [Peer review before merge]
    entry_criteria: [Sprint backlog committed]
    exit_criteria: [Build green, no critical findings]
    traceability: [Commits linked to story IDs]
  - name: Automated testing
    activities: [Integration and end-to-end tests in the pipeline]
    roles: [QA engineers]
    deliverables: [Test reports]
    security_activities: [Dynamic security testing (DAST)]
    testing: [Transaction-integrity testing, Performance testing, Regression testing]
    compliance_checkpoints: [Automated evidence collection]
    approval_gates: []
    entry_criteria: [Build green]
    exit_criteria: [All test gates pass]
    traceability: [Test results linked to requirements]
  - name: Sprint review and release
    activities: [Sprint review, Continuous delivery]
    roles: [Product owner, Stakeholders, Release manager]
    deliverables: [Accepted stories, Deployment record]
    security_activities: [Production configuration checks]
    testing: [Stakeholder acceptance, Smoke tests]
    compliance_checkpoints: [Change record with evidence]
    approval_gates: [Product owner acceptance, Change approval for high-risk releases]
    entry_criteria: [Test gates passed]
    exit_criteria: [Released and accepted]
    traceability: [Release linked to story and requirement versions]
  - name: Operate and improve
    activities: [Monitoring, Incident response, Retrospective]
    roles: [Operations, Security operations, Team]
    deliverables: [Dashboards, Improvement actions]
    security_activities: [Security monitoring, Audit-log review]
    testing: [Periodic penetration tests]
    compliance_checkpoints: [Periodic control attestation]
    approval_gates: []
    entry_criteria: [System live]
    exit_criteria: [Ongoing]
    traceability: [Incidents linked to requirements and fixes]
