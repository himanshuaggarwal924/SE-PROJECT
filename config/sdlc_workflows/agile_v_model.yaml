model: Agile + V-Model
summary: Iterative delivery inside formal verification and validation gates for regulated releases.
phases:
  - name: Requirements baseline and test strategy
    activities: [Baseline regulated requirements, Write user stories for the rest, Define V-level test strategy]
    roles: [Business analyst, Product owner, QA lead, Compliance officer]
    deliverables: [Requirements baseline, Backlog, Test strategy]
    security_activities: [Security and privacy requirements analysis]
    testing: [Acceptance tests designed per requirement]
    compliance_checkpoints: [Regulatory interpretation review]
    approval_gates: [Requirements baseline sign-off]
    entry_criteria: [Project charter approved]
    exit_criteria: [Baseline approved, backlog ready]
    traceability: [Requirement to story to acceptance test]
  - name: Architecture and verification design
    activities: [Architecture, System test design]
    roles: [Architect, Security officer, QA lead]
    deliverables: [Architecture, System test specification]
    security_activities: [Threat modelling, Security architecture review]
    testing: [System and transaction-integrity test cases]
    compliance_checkpoints: [Data-protection design review]
    approval_gates: [Architecture sign-off]
    entry_criteria: [Baseline approved]
    exit_criteria: [Architecture and system tests approved]
    traceability: [Requirements mapped to components and tests]
  - name: Iterative build sprints
    activities: [Sprints delivering stories, Continuous integration]
    roles: [Developers, Scrum master, QA engineers]
    deliverables: [Tested increments]
    security_activities: [Static application security testing (SAST), Peer code review]
    testing: [Automated unit and integration tests]
    compliance_checkpoints: [Sprint-level evidence capture]
    approval_gates: [Product owner acceptance per sprint]
    entry_criteria: [Architecture approved]
    exit_criteria: [Release scope complete]
    traceability: [Commits linked to story and requirement IDs]
  - name: Formal verification and validation
    activities: [System testing, User acceptance testing]
    roles: [QA engineers, Business users, Compliance officer]
    deliverables: [Verification report, UAT report]
    security_activities: [Dynamic security testing (DAST), Penetration test]
    testing: [Transaction-integrity testing, Performance testing, Regression testing]
    compliance_checkpoints: [Verification evidence pack]
    approval_gates: [Security sign-off, UAT sign-off]
    entry_criteria: [Release scope complete]
    exit_criteria: [All verification passed]
    traceability: [Full requirement-to-test coverage]
  - name: Controlled release
    activities: [Release, Hypercare]
    roles: [Release manager, Operations]
    deliverables: [Release notes, Runbook]
    security_activities: [Production hardening check]
    testing: [Smoke testing]
    compliance_checkpoints: [Go-live compliance confirmation]
    approval_gates: [Go-live approval]
    entry_criteria: [All sign-offs obtained]
    exit_criteria: [Stable in production]
    traceability: [Release linked to approved baseline]
