model: DevSecOps
summary: Continuous delivery with security and compliance automated in the pipeline.
phases:
  - name: Plan
    activities: [Backlog with security requirements, Define pipeline policies]
    roles: [Product owner, Security officer, Compliance officer]
    deliverables: [Backlog, Pipeline policy as code]
    security_activities: [Threat modelling per feature]
    testing: [Define automated test gates]
    compliance_checkpoints: [Map controls to pipeline checks]
    approval_gates: [Policy approval]
    entry_criteria: [Product vision agreed]
    exit_criteria: [Controls mapped to automated checks]
    traceability: [Controls linked to requirements]
  - name: Code and build
    activities: [Development, Continuous integration]
    roles: [Developers]
    deliverables: [Built artefacts, SBOM]
    security_activities: [Static application security testing (SAST), Dependency and secret scanning]
    testing: [Automated unit tests]
    compliance_checkpoints: []
    approval_gates: [Peer review before merge]
    entry_criteria: [Story ready]
    exit_criteria: [Build green, no critical findings]
    traceability: [Commits linked to requirement IDs]
  - name: Test
    activities: [Automated integration and end-to-end testing]
    roles: [QA engineers]
    deliverables: [Test reports]
    security_activities: [Dynamic security testing (DAST), Container and infrastructure scanning]
    testing: [Transaction-integrity testing, Performance testing, Regression testing]
    compliance_checkpoints: [Automated evidence collection]
    approval_gates: []
    entry_criteria: [Build green]
    exit_criteria: [All test gates pass]
    traceability: [Test results linked to requirements]
  - name: Release and deploy
    activities: [Continuous delivery to production]
    roles: [Release manager, Operations]
    deliverables: [Deployment record]
    security_activities: [Production configuration checks]
    testing: [Smoke tests, Canary checks]
    compliance_checkpoints: [Change record with evidence]
    approval_gates: [Change approval for high-risk releases]
    entry_criteria: [Test gates passed]
    exit_criteria: [Deployed and healthy]
    traceability: [Release linked to requirement versions]
  - name: Operate and monitor
    activities: [Monitoring, Incident response]
    roles: [Operations, Security operations]
    deliverables: [Monitoring dashboards, Incident reports]
    security_activities: [Security monitoring and alerting, Audit-log review]
    testing: [Periodic penetration tests]
    compliance_checkpoints: [Periodic control attestation]
    approval_gates: []
    entry_criteria: [System live]
    exit_criteria: [Ongoing]
    traceability: [Incidents linked to requirements and fixes]
