model: Agile
summary: Short iterations delivering working software with continuous stakeholder feedback.
phases:
  - name: Backlog and release planning
    activities: [Write user stories with acceptance criteria, Prioritise backlog]
    roles: [Product owner, Business analyst, Team]
    deliverables: [Product backlog, Release plan]
    security_activities: [Security user stories and abuse cases]
    testing: [Definition of done includes tests]
    compliance_checkpoints: [Compliance review of regulated stories]
    approval_gates: [Release scope agreed]
    entry_criteria: [Product vision agreed]
    exit_criteria: [Ready backlog for first sprints]
    traceability: [Stories linked to requirements]
  - name: Sprint execution
    activities: [Sprint planning, Development, Daily stand-ups]
    roles: [Developers, Scrum master, QA engineers]
    deliverables: [Potentially shippable increment]
    security_activities: [Static application security testing (SAST) in CI, Peer code review]
    testing: [Automated unit and integration tests, Transaction-integrity tests]
    compliance_checkpoints: []
    approval_gates: []
    entry_criteria: [Sprint backlog committed]
    exit_criteria: [Stories meet the definition of done]
    traceability: [Commits linked to story IDs]
  - name: Review and retrospective
    activities: [Sprint review with stakeholders, Retrospective]
    roles: [Product owner, Stakeholders, Team]
    deliverables: [Accepted stories, Improvement actions]
    security_activities: [Review open security findings]
    testing: [Stakeholder acceptance of stories]
    compliance_checkpoints: [Spot-check regulated stories]
    approval_gates: [Product owner acceptance]
    entry_criteria: [Sprint finished]
    exit_criteria: [Feedback captured in backlog]
    traceability: [Accepted stories marked in the matrix]
  - name: Release
    activities: [Release hardening, Deploy]
    roles: [Release manager, Operations]
    deliverables: [Release notes]
    security_activities: [Dynamic security testing (DAST)]
    testing: [Regression and performance testing]
    compliance_checkpoints: [Go-live compliance confirmation]
    approval_gates: [Go-live approval]
    entry_criteria: [Release candidate ready]
    exit_criteria: [Deployed and stable]
    traceability: [Release linked to story list]
