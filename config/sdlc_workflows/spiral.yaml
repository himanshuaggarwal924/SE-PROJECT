model: Spiral
summary: Risk-driven cycles; each loop resolves the biggest remaining risks before committing further.
phases:
  - name: Objectives and constraints
    activities: [Set cycle objectives, Identify constraints and alternatives]
    roles: [Product owner, Project manager, Architect]
    deliverables: [Cycle plan]
    security_activities: [Identify security objectives]
    testing: []
    compliance_checkpoints: [Confirm applicable regulatory constraints]
    approval_gates: [Cycle plan approval]
    entry_criteria: [Previous cycle reviewed]
    exit_criteria: [Objectives agreed]
    traceability: [Objectives linked to requirements]
  - name: Risk analysis and prototyping
    activities: [Risk assessment, Build prototypes for top risks]
    roles: [Architect, Risk manager, Security officer]
    deliverables: [Risk register update, Prototype findings]
    security_activities: [Threat modelling, Security spike for high risks]
    testing: [Prototype evaluation]
    compliance_checkpoints: [Risk acceptance by risk management]
    approval_gates: [Risk review]
    entry_criteria: [Objectives agreed]
    exit_criteria: [Top risks resolved or accepted]
    traceability: [Risks linked to requirements]
  - name: Development and test
    activities: [Build the increment, Verify it]
    roles: [Developers, QA engineers]
    deliverables: [Working increment, Test reports]
    security_activities: [Static application security testing (SAST), Secure code review]
    testing: [Unit and integration testing, Transaction-integrity testing]
    compliance_checkpoints: []
    approval_gates: []
    entry_criteria: [Risk review passed]
    exit_criteria: [Increment verified]
    traceability: [Tests linked to requirements]
  - name: Evaluation and planning
    activities: [Stakeholder evaluation, Plan the next cycle]
    roles: [Stakeholders, Project manager]
    deliverables: [Evaluation report, Next cycle plan]
    security_activities: [Review security findings]
    testing: [Acceptance review of the increment]
    compliance_checkpoints: [Compliance review of the increment]
    approval_gates: [Commitment to next cycle]
    entry_criteria: [Increment verified]
    exit_criteria: [Go / no-go decision recorded]
    traceability: [Changes recorded against the baseline]
