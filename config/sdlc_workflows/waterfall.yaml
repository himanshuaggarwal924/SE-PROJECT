model: Waterfall
summary: Sequential phases, each completed and approved before the next starts.
phases:
  - name: Requirements
    activities: [Elicit and document requirements, Baseline the SRS]
    roles: [Business analyst, Product owner, Compliance officer]
    deliverables: [Approved SRS, Requirements traceability matrix]
    security_activities: [Identify security and privacy requirements]
    testing: [Review requirements for testability]
    compliance_checkpoints: [Compliance review of regulatory requirements]
    approval_gates: [Requirements baseline sign-off]
    entry_criteria: [Project charter approved]
    exit_criteria: [All mandatory requirements approved]
    traceability: [Every requirement linked to its source]
  - name: Design
    activities: [Architecture and detailed design, Data model design]
    roles: [Architect, Security officer]
    deliverables: [Design specification]
    security_activities: [Threat modelling, Security architecture review]
    testing: [Test plan drafted from requirements]
    compliance_checkpoints: [Data-protection design review]
    approval_gates: [Design sign-off]
    entry_criteria: [Requirements baseline approved]
    exit_criteria: [Design approved by architecture board]
    traceability: [Requirements mapped to design elements]
  - name: Implementation
    activities: [Build components to the design]
    roles: [Developers, Tech lead]
    deliverables: [Source code, Unit tests]
    security_activities: [Static application security testing (SAST), Secure code review]
    testing: [Unit testing]
    compliance_checkpoints: []
    approval_gates: []
    entry_criteria: [Design approved]
    exit_criteria: [Code complete, unit tests pass]
    traceability: [Code changes linked to requirement IDs]
  - name: Testing
    activities: [System and integration testing, User acceptance testing]
    roles: [QA engineers, Business users]
    deliverables: [Test reports, Defect log]
    security_activities: [Dynamic security testing (DAST), Penetration test]
    testing: [Transaction-integrity testing, Regression testing, Performance testing]
    compliance_checkpoints: [Evidence pack for audit]
    approval_gates: [UAT sign-off, Security sign-off]
    entry_criteria: [Build deployed to test environment]
    exit_criteria: [No open critical defects]
    traceability: [Every requirement covered by a passed test]
  - name: Deployment and maintenance
    activities: [Release, Hypercare, Change management]
    roles: [Operations, Release manager]
    deliverables: [Release notes, Runbook]
    security_activities: [Production hardening check]
    testing: [Smoke testing]
    compliance_checkpoints: [Go-live compliance confirmation]
    approval_gates: [Go-live approval]
    entry_criteria: [All sign-offs obtained]
    exit_criteria: [System stable in production]
    traceability: [Release linked to approved baseline]
